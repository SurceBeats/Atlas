<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    {% include 'partials/_favicon.html' %} {% include 'partials/_preamble.html' %} {{ vitecss('global') | safe }}

    <meta name="atlas-version" content="{{ version }}" />    <meta name="atlas-version-hash" content="{{ versionHash }}" />

    <title>The Atlas</title>
  </head>
  <body class="h-full m-0 p-0 font-sans bg-black text-gray-200 leading-relaxed overflow-hidden">
    {% include 'partials/_preloader_explore.html' %}

    <script type="application/json" id="data-universe-config">
      {{ universe_config | tojson }}
    </script>

    <script id="data-common" type="application/json">
      {{ { "version": version } | tojson }}
    </script>

    <div id="atlas-react-root" class="w-full h-full"></div>

    {{ vitejs('__explore__') | safe }}
  </body>
</html>
